; The state of AetherRX's Exciter page in the reference screenshot 5.png, for
; scripts/compare-aetherrx.py. Read the values off the picture; the rail shows every
; stage ticked and AetherNR off. Run against a temporary copy, never this file: the
; window saves its settings when it closes.
;
;   ExpertSDR3Audio --settings <copy of this file> --page exciter --size 720x750 \
;       --screenshot exciter.png
;
; 720x750 is the window in the screenshot, which is 721x748 with the window's first and
; last rows cut off. The page draws "AetherVoice" where AetherRX draws "AetherVoice™",
; and the logo fits its word to the same width, so the letters come out about 12 % larger.
;
; Without --connect the window never connects. The radio is TEST-NET in any case, and
; the output the null device, so nothing here can reach a radio or the speakers.

[radio]
host=192.0.2.1

[output]
device=null
muteExpert=false

[nr]
method=

[chain]
order=gate, eq, comp, tube, pudu

[ui]
page=exciter

[params]
gate.enabled=1
eq.enabled=1
comp.enabled=1
tube.enabled=1
pudu.enabled=1
pudu.mode=1
pudu.pooDrive=6
pudu.pooTune=104
pudu.pooMix=0.3
pudu.dooTune=4900
pudu.dooHarmonics=7.1
pudu.dooMix=0.3
