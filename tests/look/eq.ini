; The state of AetherRX's EQ page in the reference screenshot 2.png, for
; scripts/compare-aetherrx.py. Read the values off the picture: the type icons, the
; readings under the curve and the handles on it. The rail shows every stage ticked and
; AetherNR off; no band is selected, and Ref, Smoothing and the HP/LP family are at their
; defaults. Run against a temporary copy, never this file: the window saves its settings
; when it closes.
;
;   ExpertSDR3Audio --settings <copy of this file> --page eq --size 720x750 \
;       --screenshot eq.png
;
; 720x750 is the window in the screenshot, which is 724x752 with desktop round it. Its
; row of filter widths (1.8k to 6k) and the dashed filter edges on the curve are not
; drawn here: this app does not read the radio's filter, so the curve takes their height.
;
; Without --connect the window never connects. The radio is TEST-NET in any case, and
; the output the null device, so nothing here can reach a radio or the speakers.

[radio]
host=192.0.2.1

[output]
device=null
muteExpert=false

[nr]
method=

[chain]
order=gate, eq, comp, tube, pudu

[ui]
page=eq

[params]
gate.enabled=1
eq.enabled=1
comp.enabled=1
tube.enabled=1
pudu.enabled=1
; Types: 0 high-pass, 1 low shelf, 2 peak, 3 high shelf, 4 low-pass.
; Band 1: a high shelf at 40 Hz, flat.
eq.b0.on=1
eq.b0.type=3
; Band 2: a peak at 117 Hz, +8.1 dB.
eq.b1.on=1
eq.b1.type=2
eq.b1.freq=117
eq.b1.gain=8.1
; Band 3: a low shelf at 201 Hz, -1.4 dB.
eq.b2.on=1
eq.b2.type=1
eq.b2.freq=201
eq.b2.gain=-1.4
; Band 5: a peak at 802 Hz, -3.7 dB.
eq.b4.on=1
eq.b4.freq=802
eq.b4.gain=-3.7
; Band 10: a peak at 9.54 kHz, +1.7 dB.
eq.b9.on=1
eq.b9.type=2
eq.b9.freq=9540
eq.b9.gain=1.7
