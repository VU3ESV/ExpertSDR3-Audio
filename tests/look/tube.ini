; The state of AetherRX's Tube page in the reference screenshot 4.png, for
; scripts/compare-aetherrx.py. Read the values off the picture; the rail shows every
; stage ticked and AetherNR off. Run against a temporary copy, never this file: the
; window saves its settings when it closes.
;
;   ExpertSDR3Audio --settings <copy of this file> --page tube --size 720x750 \
;       --screenshot tube.png
;
; 720x750 is the window in the screenshot, which is 725x750 with desktop round it and
; the window's last row cut off.
;
; Without --connect the window never connects. The radio is TEST-NET in any case, and
; the output the null device, so nothing here can reach a radio or the speakers.

[radio]
host=192.0.2.1

[output]
device=null
muteExpert=false

[nr]
method=

[chain]
order=gate, eq, comp, tube, pudu

[ui]
page=tube

[params]
gate.enabled=1
eq.enabled=1
comp.enabled=1
tube.enabled=1
tube.model=0
tube.mix=1
tube.drive=7.92
tube.tone=0.59
tube.bias=0.11
tube.envelope=0.51
tube.release=36.7
tube.output=7.59
pudu.enabled=1
