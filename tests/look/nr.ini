; The state of AetherRX's AetherNR page in the separability spike's render of it
; (spike/separability/out/D2/dlg_AetherNR.png, 720x480), for scripts/compare-aetherrx.py.
; There is no AetherRX screenshot of this page; the spike rendered AetherSDR's own
; AetherDspWidget from its unmodified sources. It shows NR off with NR2's page and its
; defaults, and no stage ticked on the rail. Run against a temporary copy, never this file:
; the window saves its settings when it closes.
;
;   ExpertSDR3Audio --settings <copy of this file> --page nr --size 720x480 \
;       --screenshot nr.png
;
; 720x480 is the spike's window, AetherRX's launch size. At that height this page scrolls
; its parameters, as AetherRX's squeezes them; at the window's usual 724x752 it does not.
;
; Without --connect the window never connects. The radio is TEST-NET in any case, and
; the output the null device, so nothing here can reach a radio or the speakers.

[radio]
host=192.0.2.1

[output]
device=null
muteExpert=false

[nr]
method=

[chain]
order=gate, eq, comp, tube, pudu

[ui]
page=nr
