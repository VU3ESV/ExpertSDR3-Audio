; The state of AetherRX's Final Output page in the reference screenshot 6.png, for
; scripts/compare-aetherrx.py: BOOST on and the knob at +0.8 dB, which upstream's Trim reads
; and our Volume takes; the rail shows every stage ticked and AetherNR off. Run against a
; temporary copy, never this file: the window saves its settings when it closes.
;
;   ExpertSDR3Audio --settings <copy of this file> --page output --size 720x750 \
;       --screenshot output.png
;
; 720x750 is the window in the screenshot, which is 724x751 with desktop round it, the
; window at (4, 2) and its last row cut off.
;
; Without --connect the window never connects. The radio is TEST-NET in any case, and
; the output the null device, so nothing here can reach a radio or the speakers.

[radio]
host=192.0.2.1

[output]
device=null
muteExpert=false
gainDb=0.8
boost=true

[nr]
method=

[chain]
order=gate, eq, comp, tube, pudu

[ui]
page=output

[params]
eq.enabled=1
comp.enabled=1
gate.enabled=1
tube.enabled=1
pudu.enabled=1
