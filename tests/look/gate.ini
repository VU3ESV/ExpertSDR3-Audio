; The state of AetherRX's Gate page in the reference screenshot 1.png, for
; scripts/compare-aetherrx.py. Read the values off the picture; the rail shows every
; stage ticked and AetherNR off. Run against a temporary copy, never this file: the
; window saves its settings when it closes.
;
;   ExpertSDR3Audio --settings <copy of this file> --page gate --size 720x750 \
;       --screenshot gate.png
;
; 720x750 is the window in the screenshot, which is 726x751 with desktop round it and
; the window's last rows cut off. At 726x751 the page is 6 px wider than AetherRX's, and
; its knob row spreads to fill it.
;
; Without --connect the window never connects. The radio is TEST-NET in any case, and
; the output the null device, so nothing here can reach a radio or the speakers.

[radio]
host=192.0.2.1

[output]
device=null
muteExpert=false

[nr]
method=

[chain]
order=gate, eq, comp, tube, pudu

[ui]
page=gate

[params]
gate.enabled=1
gate.mode=0
gate.threshold=-59.5
gate.return=2
gate.hold=20
gate.release=30.2
gate.floor=-20.8
gate.ratio=3.7
gate.lookahead=0
eq.enabled=1
comp.enabled=1
tube.enabled=1
pudu.enabled=1
