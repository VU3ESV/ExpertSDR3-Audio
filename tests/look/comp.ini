; The state of AetherRX's Compressor page in the reference screenshot 3.png, for
; scripts/compare-aetherrx.py. Read the values off the picture; the rail shows every
; stage ticked and AetherNR off. Run against a temporary copy, never this file: the
; window saves its settings when it closes.
;
;   ExpertSDR3Audio --settings <copy of this file> --page comp --size 720x750 \
;       --screenshot comp.png
;
; 720x750 is the window in the screenshot, which is 726x750 with desktop round it and
; the window's last row cut off.
;
; Without --connect the window never connects. The radio is TEST-NET in any case, and
; the output the null device, so nothing here can reach a radio or the speakers.

[radio]
host=192.0.2.1

[output]
device=null
muteExpert=false

[nr]
method=

[chain]
order=gate, eq, comp, tube, pudu

[ui]
page=comp

[params]
gate.enabled=1
eq.enabled=1
comp.enabled=1
comp.threshold=-35.6
comp.ratio=2.55
comp.attack=20
comp.release=124
comp.knee=6
comp.makeup=0
comp.limiter=1
comp.ceiling=-2
tube.enabled=1
pudu.enabled=1
