name: Build all platforms

# The one definition of how every platform is built, tested and packaged, called by both
# ci.yml (unsigned) and release.yml (signed). Anything a pull request proves here is
# therefore what a release will do.
#
# Artifacts are kept for only three days: the release is the permanent copy, and a private
# repository's storage allowance is small enough for one run to nearly fill it. The look renders,
# about 1 MB a platform, are kept a week: long enough to commit a golden set from.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version stamped into the binaries and file names (no leading v).'
        required: true
        type: string
      sign:
        description: 'Developer ID sign and notarize. Fails if the secrets are missing.'
        required: false
        type: boolean
        default: false
      platforms:
        description: 'Which to build: any of macos, windows, linux. Linux includes the Raspberry Pi.'
        required: false
        type: string
        default: macos windows linux

env:
  VERSION: ${{ inputs.version }}
  # 6.10, not the 6.8 LTS: 6.8.3 links Apple's AGL framework, which current macOS SDKs have
  # removed, and later 6.8 patches are commercial-only. Linux uses Debian's Qt instead.
  QT_VERSION: '6.10.3'

jobs:
  macos:
    name: macOS (Apple Silicon)
    if: contains(inputs.platforms, 'macos')
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtwebsockets
          cache: true

      - name: Install build tools
        run: brew install ninja

      - name: Cache FFTW
        id: fftw
        uses: actions/cache@v6
        with:
          path: .deps/fftw
          key: fftw-macos13-${{ runner.arch }}-${{ hashFiles('scripts/build-fftw.sh') }}

      - name: Build static FFTW
        if: steps.fftw.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: scripts/build-fftw.sh "$PWD/.deps/fftw"

      - name: Cache DeepFilterNet
        uses: actions/cache@v6
        with:
          path: vendor/aethersdr/third_party/deepfilter/lib
          key: deepfilter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/aethersdr/scripts/setup/setup-deepfilter.sh') }}

      - name: Fetch DeepFilterNet
        working-directory: vendor/aethersdr
        run: bash scripts/setup/setup-deepfilter.sh

      - name: Configure
        run: |
          PKG_CONFIG_PATH="$PWD/.deps/fftw/lib/pkgconfig" cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DESA_STATIC_PORTAUDIO=ON \
            -DESA_VERSION="$VERSION" \
            -DCMAKE_PREFIX_PATH="$PWD/.deps/fftw"

      - name: Build
        run: cmake --build build

      # The caps are not caution for its own sake: a crash inside a test once made QtTest loop on
      # its signal handler, printing 5.5 million lines and billing 53 macOS minutes.
      - name: Test
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
          # The settings tests that write this user's own store: a runner's user is throwaway.
          ESA_TEST_NATIVE_SETTINGS: '1'
          # Where test_look writes its renders: build/look, as ctest runs each test in the build folder.
          ESA_LOOK_OUT: look
        run: ctest --test-dir build --output-on-failure --test-output-size-failed 100000 --stop-on-failure --timeout 240

      # test_look's renders: the golden set for this runner's environment, ready to commit when
      # none is (docs/RELEASING.md, Look goldens), and a diff for each page that changed. Never
      # what stops a build.
      - name: Upload the look renders
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: look-macos-arm64
          path: build/look
          if-no-files-found: ignore
          retention-days: 7

      - name: Package, sign and notarize
        env:
          REQUIRE_SIGNING: ${{ inputs.sign && '1' || '0' }}
          # The same six secrets as LP-700-App. See docs/RELEASING.md.
          MACOS_CERT_P12_BASE64: ${{ inputs.sign && secrets.MACOS_CERT_P12_BASE64 || '' }}
          MACOS_CERT_PASSWORD: ${{ inputs.sign && secrets.MACOS_CERT_PASSWORD || '' }}
          KEYCHAIN_PASSWORD: ${{ inputs.sign && secrets.KEYCHAIN_PASSWORD || '' }}
          NOTARY_APPLE_ID: ${{ inputs.sign && secrets.NOTARY_APPLE_ID || '' }}
          NOTARY_TEAM_ID: ${{ inputs.sign && secrets.NOTARY_TEAM_ID || '' }}
          NOTARY_PASSWORD: ${{ inputs.sign && secrets.NOTARY_PASSWORD || '' }}
        run: scripts/package-macos.sh build/ExpertSDR3Audio.app

      # Not DFNR: the runner is a VM, where it is not offered. See dfnrCanRunHere(). So CI cannot
      # cover DFNR on macOS, and docs/RELEASING.md's local rehearsal is what does.
      - name: Smoke test from the DMG
        timeout-minutes: 10
        env:
          SMOKE_METHODS: nr2 nr4 mnr rn2 nnr
        run: |
          MOUNT="$RUNNER_TEMP/dmg"
          mkdir -p "$MOUNT"
          hdiutil attach dist/*.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          scripts/smoke-test.sh "$MOUNT/ExpertSDR3Audio.app/Contents/MacOS/ExpertSDR3Audio" "$VERSION" native
          hdiutil detach "$MOUNT"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows (x64)
    if: contains(inputs.platforms, 'windows')
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true

      - name: Install FFTW
        run: vcpkg install fftw3:x64-windows

      - name: Cache DeepFilterNet
        uses: actions/cache@v6
        with:
          path: vendor/aethersdr/third_party/deepfilter/lib
          key: deepfilter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/aethersdr/scripts/setup/setup-deepfilter.ps1') }}

      - name: Fetch DeepFilterNet
        working-directory: vendor/aethersdr
        run: ./scripts/setup/setup-deepfilter.ps1

      # clang-cl rather than cl.exe, because NR4's libspecbleach uses C99 VLAs.
      - name: Configure
        run: >
          cmake -S . -B build -A x64 -T ClangCL
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DESA_VERSION=$env:VERSION"
          "-DESA_STATIC_PORTAUDIO=ON"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
          # Otherwise Qt sends its messages, including why it is aborting, to the Windows debug
          # log, and a failing test shows no output at all.
          QT_LOGGING_TO_CONSOLE: '1'
          # The settings tests that write this user's own store: a runner's user is throwaway.
          ESA_TEST_NATIVE_SETTINGS: '1'
          # Where test_look writes its renders: build/look, as ctest runs each test in the build folder.
          ESA_LOOK_OUT: look
        run: ctest --test-dir build -C Release --output-on-failure --test-output-size-failed 100000 --stop-on-failure --timeout 240

      # test_look's renders: the golden set for this runner's environment, ready to commit when
      # none is (docs/RELEASING.md, Look goldens), and a diff for each page that changed. Never
      # what stops a build.
      - name: Upload the look renders
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: look-windows-x64
          path: build/look
          if-no-files-found: ignore
          retention-days: 7

      - name: Package
        run: scripts/package-windows.ps1 -Version $env:VERSION -BuildDir build\Release

      # Without this, --version in a GUI program shows a message box nobody can dismiss.
      - name: Smoke test the portable build
        shell: bash
        env:
          QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: '1'
        run: scripts/smoke-test.sh dist/ExpertSDR3Audio/ExpertSDR3Audio.exe "$VERSION" native

      - name: Smoke test the installer
        shell: bash
        env:
          QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: '1'
        run: |
          TARGET="$(cygpath -w "$RUNNER_TEMP/installed")"
          MSYS_NO_PATHCONV=1 dist/ExpertSDR3Audio-"$VERSION"-windows-x64-setup.exe \
            /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER "/DIR=$TARGET"
          scripts/smoke-test.sh "$RUNNER_TEMP/installed/ExpertSDR3Audio.exe" "$VERSION" native

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error
          retention-days: 3

  linux:
    name: ${{ matrix.name }}
    if: contains(inputs.platforms, 'linux')
    runs-on: ${{ matrix.runner }}
    # Debian 12 is the oldest system supported, and also Raspberry Pi OS Bookworm's base. What
    # builds here runs on anything newer, which verify-linux below then proves.
    container: debian:bookworm
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86-64)
            runner: ubuntu-24.04
            artifact: dist-linux-x86_64
          - name: Raspberry Pi (arm64)
            runner: ubuntu-24.04-arm
            artifact: dist-raspberrypi-arm64
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates file zstd xz-utils \
            dpkg-dev qt6-base-dev qt6-base-dev-tools libqt6websockets6-dev libfftw3-dev \
            libasound2-dev libgl1-mesa-dev qt6-qpa-plugins

      - uses: actions/checkout@v7

      - name: Cache DeepFilterNet
        uses: actions/cache@v6
        with:
          path: vendor/aethersdr/third_party/deepfilter/lib
          key: deepfilter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/aethersdr/scripts/setup/setup-deepfilter.sh') }}

      - name: Fetch DeepFilterNet
        working-directory: vendor/aethersdr
        run: bash scripts/setup/setup-deepfilter.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DESA_STATIC_PORTAUDIO=ON -DESA_VERSION="$VERSION"

      - name: Build
        run: cmake --build build

      - name: Test
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
          # The settings tests that write this user's own store: a runner's user is throwaway.
          ESA_TEST_NATIVE_SETTINGS: '1'
          # Where test_look writes its renders: build/look, as ctest runs each test in the build folder.
          ESA_LOOK_OUT: look
        run: ctest --test-dir build --output-on-failure --test-output-size-failed 100000 --stop-on-failure --timeout 240

      # test_look's renders: the golden set for this runner's environment, ready to commit when
      # none is (docs/RELEASING.md, Look goldens), and a diff for each page that changed. Never
      # what stops a build.
      - name: Upload the look renders
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: look-linux-${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
          path: build/look
          if-no-files-found: ignore
          retention-days: 7

      - name: Package
        run: scripts/package-linux.sh "$VERSION" build

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 3

  # The tests where threads share data without locks: the engine's thread, the window's
  # timers, the NR pool and the recorder's disk thread, plus the app itself, which
  # test_recorder runs headless as a child. Qt itself is not built with ThreadSanitizer, so
  # the ordering its event queue and thread pool give a handoff is invisible to it. Our code
  # states that ordering where it can see it (Recorder::post, Engine::startNrBuild), and
  # tests/tsan.supp names only the frames that build a queued call or pool job on the posting
  # thread, not the code that runs in one: a race inside a slot or a pool job still fails.
  # The one gap, a lambda invokeMethod runs at once on its own thread, is described there.
  tsan:
    name: Linux ThreadSanitizer
    if: contains(inputs.platforms, 'linux')
    # On the runner, not in the Debian container: the runner's kernel randomises mmap more
    # than ThreadSanitizer's memory layout allows, and only the host can turn that down.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      # The Qt the release ships on macOS and Windows. The suppressions name its classes.
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtwebsockets
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang ninja-build pkg-config libfftw3-dev libasound2-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Allow ThreadSanitizer's memory layout
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # DFNR is a prebuilt Rust library that ThreadSanitizer cannot see into; it is left out.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS=-fsanitize=thread -DCMAKE_CXX_FLAGS=-fsanitize=thread
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          -DENABLE_DFNR=OFF -DESA_STATIC_PORTAUDIO=ON -DESA_VERSION="$VERSION"

      - name: Build and run the threaded tests
        timeout-minutes: 45
        env:
          QT_QPA_PLATFORM: offscreen
          # Check copies our code makes (memcpy and the like), not the ones inside Qt's own
          # uninstrumented code. Spelled out, because Linux and macOS default differently,
          # and these are the settings tests/tsan.supp was checked with.
          TSAN_OPTIONS: >-
            halt_on_error=1 second_deadlock_stack=1 ignore_interceptors_accesses=0
            ignore_noninstrumented_modules=1 suppressions=${{ github.workspace }}/tests/tsan.supp
        run: |
          # All three, by name: building a target that has gone fails the job.
          tests="test_engine_e2e test_recorder test_aether_gui"
          cmake --build build --target $tests
          ctest --test-dir build --output-on-failure --test-output-size-failed 100000 --timeout 900 \
            -R "^($(echo $tests | tr ' ' '|'))\$"

  # Installs what was just built on clean systems, nothing from the build environment left over.
  verify-linux:
    name: ${{ matrix.target.name }} on ${{ matrix.image }}
    needs: linux
    runs-on: ${{ matrix.target.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:bookworm', 'debian:trixie', 'ubuntu:24.04', 'ubuntu:26.04']
        target:
          - name: Linux (x86-64)
            runner: ubuntu-24.04
            artifact: dist-linux-x86_64
          - name: Raspberry Pi (arm64)
            runner: ubuntu-24.04-arm
            artifact: dist-raspberrypi-arm64
    steps:
      - name: Prepare the clean system
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates file

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target.artifact }}
          path: dist

      # Before the .deb, so the AppImage cannot pass by borrowing what the .deb pulls in.
      # Exactly the libraries linuxdeploy leaves to the host on purpose: any desktop has them,
      # a headless Raspberry Pi OS Lite does not, which is why the .deb is its package.
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          apt-get install -y --no-install-recommends \
            libegl1 libglx0 libglvnd0 libopengl0 libx11-6 libx11-xcb1 libxcb1 libice6 libsm6 \
            libfontconfig1 libfreetype6 libharfbuzz0b libexpat1 libuuid1 libcom-err2 libgpg-error0 zlib1g
          apt-get install -y --no-install-recommends libasound2t64 || apt-get install -y --no-install-recommends libasound2
          chmod +x dist/*.AppImage
          scripts/smoke-test.sh "$(ls "$PWD"/dist/*.AppImage)" "$VERSION" offscreen

      # Worth knowing about even when the AppImage failed.
      - name: Smoke test the .deb
        if: ${{ !cancelled() }}
        run: |
          apt-get install -y --no-install-recommends "$(ls "$PWD"/dist/*.deb)"
          scripts/smoke-test.sh ExpertSDR3Audio "$VERSION" offscreen
